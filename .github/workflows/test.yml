# ==============================================================================
#  Virtual☆Paradise — CI Test Matrix
# ==============================================================================
#  Runs the 508-assertion test suite on Ubuntu and Arch Linux, plus a static
#  lint pass. Arch is where most users install this theme, so it matters for
#  catching package name and path drift. Ubuntu is the GitHub-hosted runner
#  and keeps CI fast for PRs.
#
#  The Arch job installs foot and lua on purpose: those make the config
#  validators in TC-1 (foot --check-config, luac -p) run for real on a second
#  machine instead of self-skipping, which is how the foot 1.28 [colors-dark]
#  rename and the invalid Lua dispatchers were caught. ghostty is AUR-only, so
#  its validator stays a local-only check.
# ==============================================================================

name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  #  Lint: static analysis on every shell, JSON and TOML file.
  # --------------------------------------------------------------------------
  lint:
    name: Lint (shellcheck + JSON/TOML)
    runs-on: ubuntu-latest
    # A qmllint version that cannot parse a file used to hang this job until
    # the six-hour default timeout. Fail fast instead.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3

      - name: ShellCheck — install.sh
        run: shellcheck -x -S warning install.sh

      - name: ShellCheck — uninstall.sh
        run: shellcheck -x -S warning uninstall.sh

      - name: ShellCheck — lib/*.sh
        run: shellcheck -x -S warning lib/*.sh

      - name: ShellCheck — bin/*.sh
        run: shellcheck -x -S warning bin/*.sh

      - name: ShellCheck — tools/*.sh
        run: shellcheck -x -S warning tools/*.sh

      - name: ShellCheck — tests/*.sh
        run: shellcheck -x -S warning tests/*.sh

      - name: QML lint — type errors
        run: |
          qmllint_bin="$(command -v qmllint || echo /usr/lib/qt6/bin/qmllint)"
          if [[ ! -x $qmllint_bin ]]; then
            echo "qmllint not installed; skipping"
            exit 0
          fi
          # Full type checking needs the Omarchy Commons/Ui modules. Without
          # them qmllint can loop on an unresolved component (network/Panel.qml
          # did), so do not run it on the bare GitHub runner at all. The local
          # suite runs the same check on a real Omarchy install.
          if [[ ! -d /usr/share/omarchy/shell/Commons || ! -d /usr/share/omarchy/shell/Ui ]]; then
            echo "Omarchy QML modules not installed; skipping qmllint (run ./tests/run.sh on Omarchy)"
            exit 0
          fi
          tmp="$(mktemp -d)"; mkdir -p "$tmp/qs"
          ln -s /usr/share/omarchy/shell/Commons "$tmp/qs/Commons"
          ln -s /usr/share/omarchy/shell/Ui "$tmp/qs/Ui"
          bad=0
          while IFS= read -r f; do
            # Print the file first: if a qmllint version hangs, the job log
            # names the file instead of stopping at an empty step.
            printf '  qmllint %s\n' "$f"
            rc=0
            out="$(timeout 10 "$qmllint_bin" -I "$tmp" "$f" 2>&1)" || rc=$?
            if [[ $rc -eq 124 ]]; then
              printf '::warning file=%s::qmllint timed out after 10s; skipped\n' "$f"
              continue
            fi
            out="$(printf '%s\n' "$out" \
              | grep -E 'incompatible-type|Cannot assign|unavailable' || true)"
            if [[ -n $out ]]; then
              printf '::error file=%s::%s\n' "$f" "$out"
              bad=1
            fi
          done < <(find bars plugins bin sddm -name '*.qml')
          rm -rf "$tmp"
          exit $bad

      - name: Validate JSON files
        run: |
          python3 -c "
          import json, sys
          from pathlib import Path
          errors = []
          for f in Path('.').rglob('*.json'):
              if '.git' in f.parts:
                  continue
              try:
                  json.loads(f.read_text())
              except Exception as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors: print(f'  ✗ {e}')
              sys.exit(1)
          print('✓ All JSON files valid')
          "

      - name: Validate TOML files
        run: |
          python3 -c "
          import sys
          from pathlib import Path
          try:
              import tomllib
          except ModuleNotFoundError:
              print('tomllib not available (Python < 3.11), skipping')
              sys.exit(0)
          errors = []
          for f in Path('.').rglob('*.toml'):
              if '.git' in f.parts:
                  continue
              try:
                  tomllib.loads(f.read_text())
              except Exception as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors: print(f'  ✗ {e}')
              sys.exit(1)
          print('✓ All TOML files valid')
          "

  # --------------------------------------------------------------------------
  #  Test suite on Ubuntu (GitHub-hosted runner, fast).
  # --------------------------------------------------------------------------
  ubuntu:
    name: Ubuntu — TC-1..TC-29 (508 assertions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh python3 systemd shellcheck

      - name: Run test suite
        run: |
          set -o pipefail
          ./tests/run.sh 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Annotate failing assertions
        if: failure()
        run: |
          # The raw job log needs repository authentication to read, while
          # check-run annotations are readable through the public API. Emit one
          # annotation per failing assertion so a red run stays diagnosable by
          # anyone (and by tooling) without a token.
          [ -f "$RUNNER_TEMP/tests.log" ] || exit 0
          # The suite prints the failure name followed by an indented detail
          # block; fold both into the annotation, otherwise a red run only says
          # "install exits 0" and not why.
          sed -e 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/tests.log" \
            | awk '
                /^  FAIL / {
                  msg = $0
                  sub(/^  FAIL /, "", msg)
                  print "::error::" msg
                  detail = 1
                  next
                }
                /^  (PASS|SKIP) / { detail = 0 }
                detail { print "::error::    " $0 }
              ' \
            | head -80 || true

      - name: Fail on untracked build residue
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::tests left the working tree dirty"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

  # --------------------------------------------------------------------------
  #  Test suite on Arch Linux (container, slower but production-like).
  # --------------------------------------------------------------------------
  arch:
    name: Arch Linux — TC-1..TC-29 (508 assertions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:latest
    steps:
      - name: Install git (required for checkout)
        run: pacman -Syu --noconfirm && pacman -S --noconfirm git

      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          # rsync and diffutils are part of a normal Omarchy install (rsync is
          # in lib/system.sh's package list, diff is used by the suite), but the
          # archlinux image is minimal. Without them the installer's rsync calls
          # and TC-2's diff -q fail for reasons that have nothing to do with the
          # theme.
          pacman -S --noconfirm \
            zsh bash python systemd shellcheck foot lua rsync diffutils

      - name: Run test suite
        run: |
          set -o pipefail
          ./tests/run.sh 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Annotate failing assertions
        if: failure()
        run: |
          # The raw job log needs repository authentication to read, while
          # check-run annotations are readable through the public API. Emit one
          # annotation per failing assertion so a red run stays diagnosable by
          # anyone (and by tooling) without a token.
          [ -f "$RUNNER_TEMP/tests.log" ] || exit 0
          # The suite prints the failure name followed by an indented detail
          # block; fold both into the annotation, otherwise a red run only says
          # "install exits 0" and not why.
          sed -e 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/tests.log" \
            | awk '
                /^  FAIL / {
                  msg = $0
                  sub(/^  FAIL /, "", msg)
                  print "::error::" msg
                  detail = 1
                  next
                }
                /^  (PASS|SKIP) / { detail = 0 }
                detail { print "::error::    " $0 }
              ' \
            | head -80 || true

      - name: Fail on untracked build residue
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::tests left the working tree dirty"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
