# Virtual☆Paradise — qt6ct colour scheme
#
# Omarchy points Qt at the GTK platform theme, so Qt apps already follow the
# theme's gtk.css. This scheme is for machines that install qt6ct and set
# QT_QPA_PLATFORMTHEME=qt6ct: pick "VirtualParadise" in qt6ct's palette tab.
#
# Order: WindowText, Button, Light, Midlight, Dark, Mid, Text, BrightText,
# ButtonText, Base, Window, Shadow, Highlight, HighlightedText, Link,
# LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText, PlaceholderText.

[ColorScheme]
active_colors=#ffeafbfa, #ff180e2e, #ff2a1a44, #ff22143a, #ff0a0515, #ff1a1030, #ffeafbfa, #ffffffff, #ffeafbfa, #ff0f081d, #ff0f081d, #ff06030c, #ff00ffdd, #ff0f081d, #ff00ffdd, #ffffb7d5, #ff180e2e, #ff0f081d, #ff180e2e, #ffeafbfa, #ff9684c0
inactive_colors=#ff9684c0, #ff180e2e, #ff2a1a44, #ff22143a, #ff0a0515, #ff1a1030, #ff9684c0, #ffffffff, #ff9684c0, #ff0f081d, #ff0f081d, #ff06030c, #ff5a3e85, #ff0f081d, #ff5a3e85, #ff5a3e85, #ff180e2e, #ff0f081d, #ff180e2e, #ff9684c0, #ff5a3e85
disabled_colors=#ff5a3e85, #ff180e2e, #ff2a1a44, #ff22143a, #ff0a0515, #ff1a1030, #ff5a3e85, #ffffffff, #ff5a3e85, #ff0f081d, #ff0f081d, #ff06030c, #ff5a3e85, #ff0f081d, #ff5a3e85, #ff5a3e85, #ff180e2e, #ff0f081d, #ff180e2e, #ff5a3e85, #ff5a3e85
