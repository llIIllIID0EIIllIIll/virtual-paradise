# ==============================================================================
#  Virtual☆Paradise — tmux theme
# ==============================================================================
#  Sourced from tmux.conf by the installer. Remove the "Virtual☆Paradise tmux
#  theme" block in tmux.conf (or this file) to opt out.
#
#  Truecolor hex needs tmux >= 3.2 with RGB passthrough. The override below is
#  additive, so sourcing this on top of an existing config is safe.

set -ag terminal-overrides ",*:RGB"

# Status bar: deep void, cyan session block, sakura current window.
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 60
set -g status-style "bg=#0f081d,fg=#eafbfa"
set -g status-left "#[fg=#0f081d,bg=#00ffdd,bold] #S #[bg=#0f081d] "
set -g status-right "#[fg=#00ff88]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#5a3e85]#h "
set -g window-status-separator ""
set -g window-status-format "#[fg=#5a3e85] #I:#W "
set -g window-status-current-format "#[fg=#0f081d,bg=#ffb7d5,bold] #I:#W #[bg=#0f081d]"

# Panes, messages and copy mode.
set -g pane-border-style "fg=#3b255c"
set -g pane-active-border-style "fg=#00ffdd"
set -g message-style "bg=#0f081d,fg=#00ffdd"
set -g message-command-style "bg=#0f081d,fg=#00ff88"
set -g mode-style "bg=#00ffdd,fg=#0f081d"
setw -g clock-mode-colour "#00ffdd"
