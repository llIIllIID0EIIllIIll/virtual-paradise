# ==============================================================================
#  Virtual☆Paradise — Kitty Configuration
# ==============================================================================
#  A neon cyberpunk terminal with GPU acceleration, smooth animations, and
#  Miku cyan accents on a deep void purple canvas.
# ==============================================================================

# --- Font ---------------------------------------------------------------------
font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 12.0
force_ltr no
adjust_line_height 115%
adjust_column_width 0
adjust_baseline 0
disable_ligatures never
font_features none

# --- Cursor -------------------------------------------------------------------
cursor #00ffdd
cursor_text_color #0f081d
cursor_shape beam
cursor_beam_thickness 1.5
cursor_underline_thickness 2.0
cursor_blink_interval 0.5
cursor_blink_stop_after 5.0
cursor_stop_blinking_after 15.0

# --- Scrollback ---------------------------------------------------------------
scrollback_lines 100000
scrollback_pager_history_size 0
scrollback_fill_enlarged_window no
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# --- Mouse --------------------------------------------------------------------
mouse_hide_wait 3.0
url_color #00ffdd
url_style curly
open_url_with default
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls yes
copy_on_select clipboard
strip_trailing_spaces never
select_by_word_characters @-./_~?&=%+#
select_by_word_characters_forward 
focus_follows_mouse no
pointer_shape_when_grabbed arrow
default_pointer_shape beam
pointer_shape_when_dragging crosshair

# --- Performance --------------------------------------------------------------
repaint_delay 10
input_delay 3
sync_to_monitor yes

# --- Terminal bell ------------------------------------------------------------
enable_audio_bell yes
visual_bell_duration 0.15
visual_bell_color #00ffdd
window_alert_on_bell yes
bell_on_tab yes
command_on_bell none
bell_path none

# --- Window layout ------------------------------------------------------------
remember_window_size no
initial_window_width 1200
initial_window_height 800
enabled_layouts *
window_resize_step_cells 2
window_resize_step_lines 2
window_border_width 1pt
draw_minimal_borders yes
window_margin_width 0
single_window_margin_width -1
window_padding_width 6
placement_strategy center
active_border_color #00ffdd
inactive_border_color #5a3e85
bell_border_color #ff0055
inactive_text_alpha 1.0
hide_window_decorations no
resize_debounce_time 0.1
resize_in_steps no
visual_window_select_characters 1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ
confirm_os_window_close -1

# --- Tab bar ------------------------------------------------------------------
tab_bar_edge top
tab_bar_margin_width 0
tab_bar_margin_height 0.0 0.0
tab_bar_min_tabs 2
tab_bar_style powerline
tab_bar_align left
tab_bar_background none
tab_bar_margin_color 
tab_bar_style_separator " "
tab_separator "  "
tab_title_template "{index}: {title}"
active_tab_title_template none
active_tab_font_style bold
inactive_tab_font_style normal
tab_activity_symbol 
window_logo_path none
window_logo_position top-left
window_logo_alpha 0.5

active_tab_foreground #0f081d
active_tab_background #00ffdd
active_tab_title_template none
inactive_tab_foreground #eafbfa
inactive_tab_background #180e2e
inactive_tab_title_template none

# --- Color scheme -------------------------------------------------------------
# Background and foreground
background #0f081d
foreground #eafbfa
background_opacity 0.85
background_blur 32
background_image none
background_image_layout tiled
background_image_linear no
dynamic_background_opacity no
background_tint 0.0
background_tint_gaps 1.0
dim_opacity 0.75

# Selection colors
selection_background #00ffdd
selection_foreground #0f081d

# Black
color0 #0f081d
color8 #5a3e85

# Red
color1 #ff00ff
color9 #ff79a8

# Green
color2 #00ff88
color10 #39ff14

# Yellow
color3 #ffe066
color11 #fff099

# Blue
color4 #00ffdd
color12 #5effeb

# Magenta
color5 #ffb7d5
color13 #ffd6e7

# Cyan
color6 #39c5bb
color14 #70f3ff

# White
color7 #eafbfa
color15 #ffffff

# --- Advanced -----------------------------------------------------------------
shell /usr/bin/zsh
editor .
close_on_child_death no
allow_remote_control socket-only
listen_on unix:/tmp/kitty
update_check_interval 0
startup_session none
clipboard_control write-clipboard write-primary read-clipboard read-primary
clipboard_max_size 512
allow_hyperlinks yes
term xterm-kitty
shell_integration enabled
allow_cloning ask
startup_menu no

# --- Keybindings --------------------------------------------------------------
# Font size
map super+equal change_font_size all +1.0
map super+minus change_font_size all -1.0
map super+0 change_font_size all 0

# Clipboard
map super+shift+c copy_to_clipboard
map super+shift+v paste_from_clipboard

# Window management
map super+n new_os_window
map super+w close_window
map super+shift+r start_resizing_window
map super+shift+d new_window

# Tab management
map super+t new_tab
map super+shift+t set_tab_title
map super+q close_tab
map super+shift+left previous_tab
map super+shift+right next_tab

# Layout management
map super+l next_layout
map super+shift+l previous_layout

# Scrolling
map super+page_up scroll_page_up
map super+page_down scroll_page_down
map super+shift+page_up scroll_to_start
map super+shift+page_down scroll_to_end

# Misc
map super+f toggle_fullscreen
map super+f11 toggle_fullscreen
map super+shift+u open_url_with_hints
map super+shift+e show_scrollback

# --- OS specific --------------------------------------------------------------
# Linux specific
linux_display_server auto
wayland_titlebar_color system
