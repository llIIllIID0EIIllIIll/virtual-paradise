# ==============================================================================
#  Virtual☆Paradise — Ghostty Configuration
# ==============================================================================
#  A neon cyberpunk terminal with frosted glass, smooth animations, and
#  Miku cyan accents on a deep void purple canvas.
# ==============================================================================

command = /usr/bin/zsh

# --- Window & Transparency ---------------------------------------------------
background = #0f081d
foreground = #eafbfa
background-opacity = 0.85
window-padding-x = 8
window-padding-y = 4
window-padding-balance = true
window-decoration = true
window-theme = ghostty
confirm-close-surface = false

# --- Cursor -------------------------------------------------------------------
cursor-color = #00ffdd
cursor-style = bar
cursor-style-blink = true
shell-integration-features = cursor,sudo,title

# --- Selection ----------------------------------------------------------------
selection-background = #00ffdd
selection-foreground = #0f081d
copy-on-select = clipboard
clipboard-paste-protection = true

# --- Font ---------------------------------------------------------------------
font-family = JetBrainsMono Nerd Font
font-size = 12
font-thicken = true
# Ghostty has no letter-spacing/line-height options; cell geometry is adjusted
# with these two (percentages, or an absolute value with a px/pt suffix).
adjust-cell-width = 0%
adjust-cell-height = 12%

# --- Mouse --------------------------------------------------------------------
mouse-hide-while-typing = true
mouse-shift-capture = always
link-url = true

# --- Scrolling ----------------------------------------------------------------
scrollback-limit = 100000

# --- Keybindings --------------------------------------------------------------
# Split panes
keybind = super+d=new_split:right
keybind = super+shift+d=new_split:down
keybind = super+shift+enter=toggle_split_zoom

# Navigate panes
keybind = super+alt+left=goto_split:left
keybind = super+alt+right=goto_split:right
keybind = super+alt+up=goto_split:top
keybind = super+alt+down=goto_split:bottom

# Font size
keybind = super+equal=increase_font_size:1
keybind = super+minus=decrease_font_size:1
keybind = super+0=reset_font_size

# Quick terminal
keybind = super+grave_accent=toggle_quick_terminal
quick-terminal-position = top
quick-terminal-screen = mouse
quick-terminal-animation-duration = 0.15

# --- Colors -------------------------------------------------------------------
# Standard colors (ANSI 0-7)
palette = 0=#0f081d
palette = 1=#ff00ff
palette = 2=#00ff88
palette = 3=#ffe066
palette = 4=#00ffdd
palette = 5=#ffb7d5
palette = 6=#39c5bb
palette = 7=#eafbfa

# Bright colors (ANSI 8-15)
palette = 8=#5a3e85
palette = 9=#ff79a8
palette = 10=#39ff14
palette = 11=#fff099
palette = 12=#5effeb
palette = 13=#ffd6e7
palette = 14=#70f3ff
palette = 15=#ffffff