# ==============================================================================
#  Virtual☆Paradise — Foot Configuration
# ==============================================================================
#  A neon cyberpunk terminal with frosted glass blur, smooth scrolling, and
#  Miku cyan accents on a deep void purple canvas.
# ==============================================================================

# --- General ------------------------------------------------------------------
[main]
shell = /usr/bin/zsh
term = foot
login-shell = no

# --- Window -------------------------------------------------------------------
app-id = foot
title = Virtual☆Paradise
locked-title = no
resize-by-cells = yes
resize-delay-ms = 10

# --- Appearance ---------------------------------------------------------------
pad = 10x6
center = yes

# --- Font ---------------------------------------------------------------------
font = JetBrainsMono Nerd Font:size=12
font-bold = JetBrainsMono Nerd Font:size=12:style=Bold
font-italic = JetBrainsMono Nerd Font:size=12:style=Italic
font-bold-italic = JetBrainsMono Nerd Font:size=12:style=Bold Italic
line-height = 18px
letter-spacing = 0
horizontal-letter-offset = 0
vertical-letter-offset = 1
box-drawings-uses-font-glyphs = no
dpi-aware = yes

# --- Cursor -------------------------------------------------------------------
[cursor]
style = beam
blink = yes
beam-thickness = 2
underline-thickness = 2

# --- Mouse --------------------------------------------------------------------
[mouse]
hide-when-typing = yes
alternate-scroll-mode = yes

# --- Colors -------------------------------------------------------------------
[colors]
alpha = 0.85
alpha-mode = matching
blur = yes
background = 0f081d
foreground = eafbfa
regular0 = 0f081d  # black
regular1 = ff00ff  # red (magenta)
regular2 = 00ff88  # green
regular3 = ffe066  # yellow
regular4 = 00ffdd  # blue (cyan)
regular5 = ffb7d5  # magenta (pink)
regular6 = 39c5bb  # cyan
regular7 = eafbfa  # white
bright0 = 5a3e85   # bright black
bright1 = ff79a8   # bright red
bright2 = 39ff14   # bright green
bright3 = fff099   # bright yellow
bright4 = 5effeb   # bright blue
bright5 = ffd6e7   # bright magenta
bright6 = 70f3ff   # bright cyan
bright7 = ffffff   # bright white
selection-foreground = 0f081d
selection-background = 00ffdd
jump-labels = 0f081d ffe066
urls = 00ffdd
scrollback-indicator = 0f081d 00ffdd

# --- Scrollback ---------------------------------------------------------------
[scrollback]
lines = 100000
multiplier = 4.0
indicator-position = relative
indicator-format = percentage

# --- URL handling -------------------------------------------------------------
[url]
launch = xdg-open ${url}
label-letters = sadfjklewcmpgh
osc8-underline = url-mode
protocols = http, https, ftp, ftps, file, gemini, gopher
uri-characters = abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_.,~:;/?#@!$&%*+="'()[]

# --- Cursor URL handling ------------------------------------------------------
[cursor]
color = 0f081d 00ffdd

# --- Keybindings --------------------------------------------------------------
[key-bindings]
scrollback-up-page = Shift+Page_Up
scrollback-up-half-page = none
scrollback-up-line = none
scrollback-down-page = Shift+Page_Down
scrollback-down-half-page = none
scrollback-down-line = none
scrollback-home = none
scrollback-end = none
clipboard-copy = Control+Shift+c XF86Copy
clipboard-paste = Control+Shift+v XF86Paste
primary-paste = Shift+Insert
search-start = Control+Shift+r
font-increase = Control+plus Control+equal
font-decrease = Control+minus
font-reset = Control+0
spawn-terminal = Control+Shift+n
fullscreen = F11
pipe-visible = none
pipe-scrollback = none
pipe-selected = none
show-urls-launch = Control+Shift+u
show-urls-copy = none
show-urls-persistent = none

# --- Mouse bindings -----------------------------------------------------------
[mouse-bindings]
selection-override-modifiers = Shift
primary-paste = BTN_MIDDLE
select-begin = BTN_LEFT
select-begin-block = Control+BTN_LEFT
select-extend = BTN_RIGHT
select-extend-character-wise = Control+BTN_RIGHT
select-word = BTN_LEFT-2
select-word-whitespace = Control+BTN_LEFT-2
select-row = BTN_LEFT-3
